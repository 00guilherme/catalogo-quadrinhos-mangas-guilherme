# Identifica a aplicação no ecossistema Spring.
spring.application.name=catalogo-quadrinhos

# Conexão com o banco MySQL local e parâmetros de timezone/SSL.
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_quadrinhos?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Atualiza o esquema, mantém o SQL oculto no log e formata comandos gerados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mantém configurações de serialização JSON previsíveis para a API.
spring.jackson.serialization.write-dates-as-timestamps=false

# Porta HTTP usada para servir a API e os arquivos estáticos.
server.port=8080
